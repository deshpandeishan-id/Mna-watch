name: mna-watch

on:
  schedule:
    # Every 10 minutes. GitHub may start scheduled runs a few minutes late at busy times.
    # You can lower this to */5 (GitHub's minimum).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

permissions:
  contents: write         # needed to save state/state.json back to the repo

concurrency:
  group: mna-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Poll sources and email new deals
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Optional overrides (Settings > Secrets and variables > Actions > Variables)
          SOURCES: ${{ vars.SOURCES }}
          ALERT_STAGES: ${{ vars.ALERT_STAGES }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          EXTRA_RSS_FEEDS: ${{ vars.EXTRA_RSS_FEEDS }}
        run: python -m mna_watch once --commit-state

